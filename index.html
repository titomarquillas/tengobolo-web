<style>
:root{--ink:#141414;--ink2:#5d5750;--bg:#f5f1ea;--card:#fffdf9;--line:#ddd5c8;--accent:#b5522f;--accent2:#8f3d20;--tint:#efe3d6;--sun:#e8c9a8;--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;--font:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif}
body[data-role=artist]{--bg:#f8eee6;--line:#e6d3c3;--accent:#c4491a;--accent2:#9c3410;--tint:#f3dccb}
body[data-role=agency]{--bg:#eef2f6;--ink2:#506070;--line:#d3dde7;--accent:#1f6fb2;--accent2:#14507f;--tint:#dde9f4}
*{box-sizing:border-box}html{scroll-behavior:smooth;overflow-x:clip}
body{margin:0;font:17px/1.6 var(--font);color:var(--ink);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;overflow-x:clip;-webkit-font-smoothing:antialiased}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header{position:sticky;top:0;z-index:5;background:rgba(245,241,234,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
body[data-role=artist] header{background:rgba(248,238,230,.9)}body[data-role=agency] header{background:rgba(238,242,246,.9)}
.bar{max-width:1040px;margin:0 auto;padding:10px 20px 4px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;color:inherit;text-decoration:none}.brand img{height:58px;width:auto;display:block}
.zone{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);display:flex;align-items:center;gap:8px;white-space:nowrap}
.zone:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
nav{max-width:1040px;margin:0 auto;display:flex;gap:2px;overflow-x:auto;padding:0 14px 8px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:none;min-height:40px;padding:0 14px;border:0;background:transparent;font:inherit;font-size:15px;color:var(--ink2);cursor:pointer;position:relative;border-radius:0}
nav button:hover{color:var(--ink)}
nav button[aria-current=true]{color:var(--ink);font-weight:600}
nav button[aria-current=true]:after{content:"";position:absolute;left:14px;right:14px;bottom:2px;height:2px;background:var(--accent)}
main{max-width:1040px;width:100%;margin:0 auto;padding:12px 20px 72px;flex:1}
h1,h2,h3{font-family:var(--serif);font-weight:400;letter-spacing:-.015em}
h2{font-size:34px;line-height:1.1;margin:34px 0 12px}
.card h3{margin:0 0 4px;font-size:22px}
.sub,.meta{color:var(--ink2)}.meta{font-size:15px}
.btn{min-height:50px;padding:0 28px;border:1px solid var(--ink);border-radius:999px;background:var(--ink);color:#fff;font:inherit;font-weight:500;cursor:pointer;transition:background .2s,color .2s,transform .2s}
body[data-role] .btn{background:var(--accent);border-color:var(--accent)}
.btn:hover{transform:translateY(-1px);background:var(--accent);border-color:var(--accent)}
.btn.sec,body[data-role] .btn.sec{background:transparent;color:var(--ink);border:1px solid var(--ink)}
.btn.sec:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn:disabled{opacity:.55}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0;align-items:center}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:6px;padding:18px 20px;margin:16px 0}
form{display:grid;gap:16px;margin:16px 0;max-width:560px}
label{display:grid;gap:6px;color:var(--ink2);font-size:14px;letter-spacing:.02em}
input,textarea,select{font:inherit;font-size:16px;padding:13px 14px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
.msg{padding:13px 16px;border-radius:6px;margin:14px 0;border:1px solid var(--line)}.ok{background:#e6f1e2}.err{background:#f9e3dc}.info{background:var(--tint)}
ol{padding-left:22px}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.head{display:flex;gap:14px;align-items:center}.head>div{min-width:0;flex:1}input[type=file]{width:100%;max-width:100%;font-size:14px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.grid figure{margin:0;position:relative}.grid img{width:100%;height:150px;object-fit:cover;border-radius:6px;display:block}
.grid button{position:absolute;top:6px;right:6px;min-height:36px;padding:0 10px;border:0;border-radius:4px;background:#fff;color:#8a1c0e;cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.links a{padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--accent2);text-decoration:none;font-size:15px;background:#fff}
.video{position:relative;padding-top:56.25%;margin:10px 0}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:6px}
.sect{border-top:1px solid var(--line);margin-top:24px;padding-top:4px}
footer{background:var(--ink);color:#cfc7ba;margin-top:auto}footer p{max-width:1040px;margin:0 auto;padding:22px 20px;font-size:13px;letter-spacing:.03em}
.promo{border:1px solid var(--line);background:var(--card);border-left:3px solid var(--accent);border-radius:4px;padding:12px 16px;margin:16px 0;font-size:15px}
.promo a{color:var(--accent2);font-weight:600}
[hidden]{display:none!important}
.ph{background:#f6ecb9;border:1px dashed #9b8a2b;padding:1px 6px;border-radius:4px;color:#141414}
fieldset{border:0;padding:0;margin:0}.steps{color:var(--ink2);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:6px 0}.chk{display:flex;gap:10px;align-items:center;color:var(--ink)}.chk input{width:22px;height:22px;flex:none}.tag{display:inline-block;background:var(--tint);border-radius:999px;padding:3px 12px;font-size:13px;margin:2px 4px 2px 0}
/* ===== portada editorial ===== */
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink2)}
.hero8{display:grid;gap:30px;padding:28px 0 20px;align-items:center}
.hero8 h2.mega{font-size:clamp(44px,10.5vw,88px);line-height:.96;letter-spacing:-.035em;margin:12px 0 18px;font-weight:400}
.hero8 h2.mega em{color:var(--accent);font-style:italic;display:block}
.hero8 p.lead{font-size:19px;color:var(--ink2);max-width:28em;margin:0 0 8px}
.lnk{background:none;border:0;font:inherit;color:var(--ink);padding:0 4px;min-height:48px;cursor:pointer;border-bottom:1px solid var(--ink);border-radius:0}
.lnk:hover{color:var(--accent);border-color:var(--accent)}
.arch{position:relative;justify-self:center;width:min(86%,360px)}
.arch:before{content:"";position:absolute;inset:-6% -14% auto auto;width:78%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#d9cdf3,#a99bd6 55%,transparent 72%);filter:blur(2px);opacity:.9}
.arch:after{content:"";position:absolute;left:-12%;bottom:6%;width:34%;aspect-ratio:1;border-radius:50%;background:var(--accent);opacity:.9}
.arch img{position:relative;z-index:1;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:999px 999px 8px 8px;display:block}
.arch figcaption{position:relative;z-index:2;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:10px}
@media(min-width:820px){.hero8{grid-template-columns:1.25fr 1fr;padding:56px 0 40px;gap:48px}.hero8 p.lead{font-size:21px}}
.hline{border:0;border-top:1px solid var(--line);margin:34px 0 0}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:44px 0 18px}
.sech h2{margin:0;font-size:clamp(30px,6vw,46px)}.sech span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.wall{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.wk{position:relative;border:0;padding:0;border-radius:6px;overflow:hidden;aspect-ratio:4/5;cursor:pointer;font:inherit;text-align:left;background:#ddd}
.wk svg{position:absolute;inset:0;width:100%;height:100%;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.wk:hover svg{transform:scale(1.05)}
.wk .cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 14px;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;background:linear-gradient(transparent,rgba(0,0,0,.55))}
.wk.lt .cap{color:#141414;background:linear-gradient(transparent,rgba(255,255,255,.55))}
.wk b{font-family:var(--serif);font-weight:400;font-size:24px;line-height:1}.wk small{font-size:11px;letter-spacing:.16em;display:block;margin-bottom:6px;opacity:.85}
.wk i{font-style:normal;font-size:20px}
@media(min-width:760px){.wall{grid-template-columns:repeat(3,1fr);gap:16px}.wk:nth-child(3n+2){margin-top:34px}}
.cols3{display:grid;gap:0;border-top:1px solid var(--ink)}
.cl{padding:22px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px 1fr;gap:12px}
.cl .n{font-family:var(--serif);font-size:44px;line-height:1;color:var(--accent)}
.cl b{font-family:var(--serif);font-weight:400;font-size:24px;display:block}.cl span.d{color:var(--ink2)}
@media(min-width:760px){.cols3{grid-template-columns:repeat(3,1fr);gap:28px;border-top:0}.cl{grid-template-columns:1fr;border-top:1px solid var(--ink);border-bottom:0;padding-top:18px}}
.duo{display:grid;gap:14px}
.du{border:1px solid var(--line);border-radius:6px;padding:28px 24px;display:grid;gap:12px;justify-items:start;background:var(--card)}
.du h3{margin:0;font-size:32px;line-height:1.05}.du p{margin:0;color:var(--ink2)}
.du.a{background:#f3dccb;border-color:#e6c6ae}.du.b{background:#dde9f4;border-color:#c1d6ea}
.du.a .btn{background:#c4491a;border-color:#c4491a}.du.b .btn{background:#1f6fb2;border-color:#1f6fb2}
@media(min-width:760px){.duo{grid-template-columns:1fr 1fr}}
.end{margin:70px 0 10px;padding:56px 0 8px;border-top:1px solid var(--ink);display:grid;gap:18px;justify-items:start}
.end h2{margin:0;font-size:clamp(34px,8vw,74px);line-height:1;max-width:14em}.end h2 em{color:var(--accent)}
</style>

<body>
<header>
  <div class="bar"><a class="brand" href="/" aria-label="TengoBolo, inicio"><img src="logo.png" alt="TengoBolo" width="68" height="67"><h1 class="sr">TengoBolo</h1></a><span class="zone" id="zone">Creativa Network</span></div>
  <nav aria-label="Secciones" id="nav"></nav>
</header>
<main id="view"></main>
<footer><p>Versión piloto de TengoBolo · Creativa Network. Si recargas la página tendrás que volver a entrar.</p></footer>
<script>
const API='https://bolo-backend-pd6z.onrender.com';
function freeBanner(){return `<div class="promo"><b>Artistas: gratis, siempre.</b> Agencias, empresas y particulares: alta y primer bolo gratis; después, suscripción mensual de 15 €, sin comisión (<a href="#" data-go="precios">ver Precios</a>).</div>`;}
function payBox(){return `<div class="promo"><b>Tu primer bolo era gratis.</b> Para publicar más bolos necesitas el plan Cliente: 15 € al mes o 150 € al año, sin comisión (<a href="#" data-go="precios">ver Precios</a>).
  <ol><li>Haz una transferencia: titular <span class="ph">[TITULAR: pendiente]</span>, IBAN <span class="ph">[IBAN: pendiente]</span>.</li><li>Concepto: <b>TengoBolo + el correo de tu cuenta + plan Cliente</b>.</li><li>Escríbenos con el justificante a <span class="ph">[CORREO DE CONTACTO: pendiente]</span> y activaremos tu cuenta.</li></ol></div>`;}
let session=null, me=null, tab='inicio';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
async function call(path,{method='GET',body,auth}={}){
  let r;
  try{r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(auth&&session?{Authorization:'Bearer '+session.access_token}:{})},body:body===undefined?undefined:JSON.stringify(body)});}
  catch{throw new Error('No se pudo conectar con el servidor. Si estaba dormido, espera 1 minuto y vuelve a intentarlo.');}
  if(r.status===204)return null;
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const er=new Error(d.error||'Algo ha fallado. Inténtalo de nuevo.');er.status=r.status;throw er;}
  return d;
}
function setTab(t){tab=t;render();window.scrollTo(0,0);}
function renderNav(){paint();
  const items=[['inicio','Inicio'],['artistas','Artistas'],['proyectos','Proyectos'],['publicar','Publicar'],['propuestas','Propuestas'],['precios','Precios'],[session?'perfil':'entrar',session?'Mi perfil':'Entrar']];
  $('#nav').innerHTML=items.map(([k,l])=>`<button data-t="${k}" ${tab===k?'aria-current="true"':''}>${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
}
function msg(kind,text){return `<div class="msg ${kind}" role="status">${esc(text)}</div>`;}
function needLogin(){return `<h2>Necesitas entrar</h2><p>Para ver esto, crea tu cuenta o entra.</p><div class="row"><button class="btn" id="go">Crear cuenta o entrar</button></div>`;}
async function render(){
  renderNav();const v=$('#view');
  if(['artistas','proyectos','publicar','propuestas','perfil'].includes(tab)&&!session){v.innerHTML=needLogin();$('#go').onclick=()=>setTab('entrar');return;}
  if(tab==='inicio')return home(v);
  if(tab==='entrar')return enter(v);
  if(tab==='precios')return pricing(v);
  if(tab==='propuestas')return proposalsView(v);
  if(tab==='artistas')return artists(v);
  if(tab==='proyectos')return projects(v);
  if(tab==='publicar')return publish(v);
  if(tab==='perfil')return profile(v);
}
function home(v){
  const confirmed=/type=(signup|email)|access_token=/.test(location.hash);
  const failed=/error=|error_description=/.test(location.hash);
  if(confirmed||failed)history.replaceState(null,'',location.pathname);
  v.innerHTML=`${confirmed?msg('ok','Correo confirmado. Ya puedes entrar con tu cuenta.'):''}${failed?msg('err','El enlace del correo no es válido o ha caducado. Crea la cuenta otra vez o pide un correo nuevo.'):''}
  ${freeBanner()}
  <section class="hero8">
    <div>
      <span class="eyebrow">Creativa Network · Artistas y agencias</span>
      <h2 class="mega">Tu próximo bolo <em>empieza aquí</em></h2>
      <p class="lead">Enseña tu trabajo, encuentra proyectos y ponte en contacto. Perfil y propuestas gratis, siempre.</p>
      <div class="row"><button class="btn" id="a">${session?'Ver proyectos':'Crear cuenta gratis'}</button><button class="lnk" data-go="precios">Ver precios →</button></div>
    </div>
    <figure class="arch" style="margin:0"><img src="hero.jpg" alt="Paleta, guitarra y cámara con un apretón de manos al fondo" width="800" height="1067"><figcaption>Talento en directo</figcaption></figure>
  </section>
  <div class="sech"><h2>Disciplinas</h2><span>Seis formas de crear</span></div>

  const ARTS=['Música','Pintura','Fotografía','Diseño','Audiovisual','Danza','Teatro','Otro'];

  <form id="f" novalidate>
  <fieldset data-s="0"><h3>1. Qué y dónde</h3>
    <label>Título del bolo<input name="title" required minlength="3" maxlength="150" placeholder="Ej: Música en directo para una boda"></label>
    <label>Tipo de arte<select name="art">${ARTS.map(a=>`<option>${a}</option>`).join('')}</select></label>
    <label>Descripción<textarea name="description" required minlength="10" rows="4" placeholder="Qué necesitas, duración, público..."></textarea></label>
    <label>Lugar (ciudad o zona)<input name="location" maxlength="120"></label></fieldset>
  <fieldset data-s="1" hidden><h3>2. Fechas y dinero</h3>
    <label>Fecha del bolo<input name="event_date" type="date" required min="${today}"></label>
    <label>Fecha límite para recibir propuestas (opcional)<input name="deadline" type="date" min="${today}"></label>
    <label>Presupuesto en € (opcional)<input name="budget" type="number" min="0"></label></fieldset>
  <fieldset data-s="2" hidden><h3>3. Extras y requisitos</h3>
    <p class="meta">Marca lo que ofreces:</p>
    <label class="chk"><input type="checkbox" name="x_equipo"> Equipo de sonido/luz</label>
    <label class="chk"><input type="checkbox" name="x_transporte"> Transporte</label>
    <label class="chk"><input type="checkbox" name="x_alojamiento"> Alojamiento</label>
    <label>Rider (necesidades técnicas, opcional)<textarea name="rider" rows="4" maxlength="3000" placeholder="Ej: 2 micros, escenario de 3x2 m..."></textarea></label>
    <label class="chk"><input type="checkbox" name="ins"> Exijo que el artista tenga seguro de responsabilidad civil</label></fieldset>
  <fieldset data-s="3" hidden><h3>4. Contacto privado</h3>
    <p class="meta">Solo lo verán tú y el artista cuya propuesta aceptes. Nadie más.</p>
    <label>Teléfono<input name="phone" type="tel" maxlength="25" autocomplete="tel"></label>
    <label>Dirección del bolo<input name="address" maxlength="300"></label></fieldset>
  <div id="e"></div>
  <div class="row"><button class="btn sec" type="button" id="bk">Atrás</button><button class="btn" type="button" id="nx">Siguiente</button><button class="btn" type="submit" id="ok" hidden>Publicar bolo</button></div></form>`;
  let step=0;const fs=[...v.querySelectorAll('fieldset')];
  const show=()=>{fs.forEach((x,i)=>x.hidden=i!==step);$('#st').textContent=`Paso ${step+1} de ${fs.length}`;$('#bk').hidden=step===0;$('#nx').hidden=step===fs.length-1;$('#ok').hidden=step!==fs.length-1;$('#e').innerHTML='';window.scrollTo(0,0);};
  $('#bk').onclick=()=>{step--;show();};
  $('#nx').onclick=()=>{const bad=[...fs[step].querySelectorAll('input,textarea,select')].find(i=>!i.checkValidity());if(bad){bad.reportValidity();return;}step++;show();};
  show();
  $('#f').onsubmit=async e=>{e.preventDefault();if(step<fs.length-1){$('#nx').click();return;}const f=Object.fromEntries(new FormData(e.target));
    const dl=f.deadline||null;if(dl&&dl>f.event_date){$('#e').innerHTML=msg('err','La fecha límite no puede ser posterior al bolo.');return;}
    const b=$('#ok');b.disabled=true;
    try{await call('/api/projects',{method:'POST',auth:true,body:{title:f.title,description:f.description,disciplines:[f.art],location:f.location,budget_eur:f.budget?Number(f.budget):null,event_date:f.event_date,deadline:dl,extras:['equipo','transporte','alojamiento'].filter(k=>f['x_'+k]),rider:f.rider||'',requires_insurance:!!f.ins,phone:f.phone||'',address:f.address||''}});
      v.innerHTML=msg('ok','Bolo publicado. Ya aparece en Proyectos. Cuando aceptes una propuesta, el artista verá tu teléfono y dirección.');}
    catch(err){b.disabled=false;if(err.status===402){$('#e').innerHTML=payBox();}else $('#e').innerHTML=msg('err',err.message);}};});}
// Reduce la foto en el navegador (máx. 1600 px, JPEG) antes de subirla: así caben muchas en el almacén gratuito.
async function shrink(file){
  if(!/^image\//.test(file.type))throw new Error('Elige un archivo de imagen (JPG, PNG o WebP).');
  let bmp;try{bmp=await createImageBitmap(file);}catch{throw new Error('No se puede leer esa imagen. Prueba con una foto JPG.');}
  const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));if(!blob)throw new Error('No se pudo preparar la foto.');
  return await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=()=>ko(new Error('No se pudo leer la foto.'));fr.readAsDataURL(blob);});
}
function profile(v){loading(v,async()=>{const m=await getMe();const full=await call('/api/profiles/'+encodeURIComponent(m.id),{auth:true});const md=mediaHtml(full.media,true);
  v.innerHTML=`<h2>Mi perfil</h2><p class="meta">${m.role==='artist'?'Plan: gratuito, propuestas sin límite':(m.plan==='free'?'Plan: gratuito (primer bolo gratis)':'Plan Cliente: bolos ilimitados')}</p>
  <div class="head">${avatar(m)}<div><label>Foto de perfil<input type="file" id="av" accept="image/*"></label></div></div><div id="ae"></div>
  <form id="f"><label>Nombre<input name="name" required minlength="2" value="${esc(m.name)}"></label><label>Sobre mí<textarea name="bio" rows="4">${esc(m.bio)}</textarea></label><label>Disciplinas (separadas por comas)<input name="disciplines" value="${esc((m.disciplines||[]).join(', '))}"></label><label>Ciudad<input name="location" value="${esc(m.location)}"></label><label>Enlace a tu portfolio (https://…)<input name="portfolio_url" value="${esc(m.portfolio_url)}"></label>
  <h3 style="margin:8px 0 0">Redes</h3>${SOCIALS.map(([k,n])=>`<label>${n}${k==='website'?' (https://…)':' (enlace completo, https://…)'}<input name="${k}" type="url" value="${esc(m[k])}" placeholder="https://"></label>`).join('')}
  <div id="e"></div><button class="btn" type="submit">Guardar</button></form>
  <div class="sect"><h2>Fotos (${md.nPhotos}/8)</h2>${md.photos||'<p class="meta">Aún no has subido fotos.</p>'}<label>Añadir foto<input type="file" id="ph" accept="image/*"></label><div id="pe"></div></div>
  <div class="sect"><h2>Vídeos (${md.nVideos}/5)</h2>${md.videos||'<p class="meta">Aún no has añadido vídeos.</p>'}<form id="vf"><label>Enlace de YouTube, Vimeo, Instagram, Facebook o TikTok<input name="url" type="url" required placeholder="https://"></label><button class="btn" type="submit">Añadir vídeo</button><div id="ve"></div></form></div>
  <div class="row"><button class="btn sec" id="out">Salir</button></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const body={name:f.name,bio:f.bio,disciplines:list(f.disciplines),location:f.location,portfolio_url:f.portfolio_url};SOCIALS.forEach(([k])=>body[k]=(f[k]||'').trim());
    try{me=await call('/api/me',{method:'PATCH',auth:true,body});$('#e').innerHTML=msg('ok','Guardado.');}catch(err){$('#e').innerHTML=msg('err',err.message);}};
  const busy=(id,t)=>{$(id).innerHTML=msg('info',t);};
  $('#av').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('#ae','Subiendo foto…');try{const image=await shrink(f);await call('/api/me/avatar',{method:'POST',auth:true,body:{image}});me=null;profile(v);}catch(err){$('#ae').innerHTML=msg('err',err.message);}};
  $('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('#pe','Subiendo foto…');try{const image=await shrink(f);await call('/api/media/photo',{method:'POST',auth:true,body:{image}});profile(v);}catch(err){$('#pe').innerHTML=msg('err',err.message);}};
  $('#vf').onsubmit=async e=>{e.preventDefault();const url=new FormData(e.target).get('url');try{await call('/api/media/video',{method:'POST',auth:true,body:{url}});profile(v);}catch(err){$('#ve').innerHTML=msg('err',err.message);}};
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Borrar?'))return;try{await call('/api/media/'+encodeURIComponent(b.dataset.del),{method:'DELETE',auth:true});profile(v);}catch(err){alert(err.message);}});
  $('#out').onclick=async()=>{try{await call('/api/auth/logout',{method:'POST',auth:true,body:{refresh_token:session.refresh_token}});}catch{}session=null;me=null;setTab('inicio');};});}
call('/health').catch(()=>{});
render();
</script>
