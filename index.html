<style>
:root{--ink:#2a1d14;--ink2:#6b5646;--bg:#fbf6ee;--card:#fff;--line:#e8dccb;--accent:#c8641a;--accent2:#8a3f0e}
*{box-sizing:border-box}
body{margin:0;font:17px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{max-width:760px;margin:0 auto;padding:20px 16px 0}
h1{font-size:44px;line-height:1.05;margin:8px 0 6px;color:var(--accent2)}
h2{font-size:24px;margin:28px 0 8px}
.lead{font-size:22px;margin:0 0 4px}
.sub{color:var(--ink2);margin:0 0 16px}
nav{display:flex;flex-wrap:wrap;gap:6px;max-width:760px;margin:0 auto;padding:8px 16px;border-bottom:1px solid var(--line)}
nav button{min-height:44px;padding:0 14px;border:0;background:none;font:inherit;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent}
nav button[aria-current=true]{color:var(--ink);border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:8px 16px 48px}
.hero{width:100%;height:300px;object-fit:cover;border-radius:14px;margin:16px 0}
.btn{min-height:48px;padding:0 20px;border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.sec{background:none;color:var(--accent2);border:1px solid var(--accent2)}
.btn:disabled{opacity:.6}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.card h3{margin:0 0 4px;font-size:18px}.meta{color:var(--ink2);font-size:15px}
form{display:grid;gap:12px;margin:12px 0}
label{display:grid;gap:4px;color:var(--ink2);font-size:15px}
input,textarea,select{font:inherit;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
.msg{padding:12px 14px;border-radius:10px;margin:10px 0}.ok{background:#e9f4e4}.err{background:#fbe5e0}.info{background:#fdf0da}
ol{padding-left:22px}
.avatar{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--line);flex:none}
.head{display:flex;gap:14px;align-items:center}.head>div{min-width:0;flex:1}input[type=file]{width:100%;max-width:100%;font-size:14px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:10px 0}
.grid figure{margin:0;position:relative}.grid img{width:100%;height:150px;object-fit:cover;border-radius:10px;display:block}
.grid button{position:absolute;top:6px;right:6px;min-height:36px;padding:0 10px;border:0;border-radius:8px;background:#fff;color:#8a1c0e;cursor:pointer}
.links{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.links a{padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--accent2);text-decoration:none;font-size:15px;background:#fff}
.video{position:relative;padding-top:56.25%;margin:10px 0}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:10px}
.sect{border-top:1px solid var(--line);margin-top:22px;padding-top:4px}
footer{max-width:760px;margin:0 auto;padding:16px;color:var(--ink2);font-size:14px;border-top:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px}.brand img{width:64px;height:64px;flex:none}
.brand h1{margin:0}
.promo{background:#fff3e0;border:2px solid var(--accent);border-radius:12px;padding:12px 16px;margin:12px 0}
.promo b{color:var(--accent2)}
.herologo{display:block;width:min(70%,260px);height:auto;margin:8px auto 12px}
[hidden]{display:none!important}
.ph{background:#fff6b0;border:1px dashed #a08a00;padding:1px 6px;border-radius:4px;font-weight:600}
@media(min-width:700px){h1{font-size:60px}.brand img{width:88px;height:88px}}
</style>

<script>
const LOGO=document.querySelector('img[data-logo]').src;
const API='https://bolo-backend-pd6z.onrender.com';
function freeBanner(){return `<div class="promo"><b>Registro gratis para todos.</b> Los artistas envían su primera propuesta gratis; a partir de la segunda hace falta un plan de pago desde 5 € al mes (<a href="#" data-go="precios">ver Precios</a>).</div>`;}
function payBox(){return `<div class="promo"><b>Tu primera propuesta era gratis.</b> Para enviar más propuestas necesitas el plan Artista: 5 € al mes o 50 € al año (<a href="#" data-go="precios">ver Precios</a>).
  <ol><li>Haz una transferencia: titular <span class="ph">[TITULAR: pendiente]</span>, IBAN <span class="ph">[IBAN: pendiente]</span>.</li><li>Concepto: <b>TengoBolo + el correo de tu cuenta + plan</b>.</li><li>Escríbenos con el justificante a <span class="ph">[CORREO DE CONTACTO: pendiente]</span> y activaremos tu cuenta.</li></ol></div>`;}
let session=null, me=null, tab='inicio';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
async function call(path,{method='GET',body,auth}={}){
  let r;
  try{r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(auth&&session?{Authorization:'Bearer '+session.access_token}:{})},body:body===undefined?undefined:JSON.stringify(body)});}
  catch{throw new Error('No se pudo conectar con el servidor. Si estaba dormido, espera 1 minuto y vuelve a intentarlo.');}
  if(r.status===204)return null;
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const er=new Error(d.error||'Algo ha fallado. Inténtalo de nuevo.');er.status=r.status;throw er;}
  return d;
}
function setTab(t){tab=t;render();window.scrollTo(0,0);}
function renderNav(){
  const items=[['inicio','Inicio'],['artistas','Artistas'],['proyectos','Proyectos'],['publicar','Publicar'],['propuestas','Propuestas'],['precios','Precios'],[session?'perfil':'entrar',session?'Mi perfil':'Entrar']];
  $('#nav').innerHTML=items.map(([k,l])=>`<button data-t="${k}" ${tab===k?'aria-current="true"':''}>${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
}
function msg(kind,text){return `<div class="msg ${kind}" role="status">${esc(text)}</div>`;}
function needLogin(){return `<h2>Necesitas entrar</h2><p>Para ver esto, crea tu cuenta o entra.</p><div class="row"><button class="btn" id="go">Crear cuenta o entrar</button></div>`;}
async function render(){
  renderNav();const v=$('#view');
  if(['artistas','proyectos','publicar','propuestas','perfil'].includes(tab)&&!session){v.innerHTML=needLogin();$('#go').onclick=()=>setTab('entrar');return;}
  if(tab==='inicio')return home(v);
  if(tab==='entrar')return enter(v);
  if(tab==='precios')return pricing(v);
  if(tab==='propuestas')return proposalsView(v);
  if(tab==='artistas')return artists(v);
  if(tab==='proyectos')return projects(v);
  if(tab==='publicar')return publish(v);
  if(tab==='perfil')return profile(v);
}
function home(v){
  const confirmed=/type=(signup|email)|access_token=/.test(location.hash);
  const failed=/error=|error_description=/.test(location.hash);
  if(confirmed||failed)history.replaceState(null,'',location.pathname);
  v.innerHTML=`${confirmed?msg('ok','Correo confirmado. Ya puedes entrar con tu cuenta.'):''}${failed?msg('err','El enlace del correo no es válido o ha caducado. Crea la cuenta otra vez o pide un correo nuevo.'):''}
  ${freeBanner()}
  <img class="herologo" src="${LOGO}" alt="TengoBolo, de bolo en bolo" width="260" height="260">
  <img class="hero" src="hero.jpg" alt="Paleta, guitarra y cámara con un apretón de manos al fondo" width="800" height="1067">
  <h2>Qué es TengoBolo</h2>
  <p>Una red donde los artistas muestran su trabajo y las agencias publican proyectos y reciben propuestas. Música, pintura, fotografía, diseño, audiovisual y más. Gratis para registrarte; los artistas envían su primera propuesta gratis.</p>
  <div class="row">${session?'<button class="btn" id="a">Ver proyectos</button>':'<button class="btn" id="a">Crear cuenta</button>'}</div>
  <h2>Cómo funciona</h2>
  <ol><li>El artista crea su cuenta y su perfil con disciplina, ciudad y portfolio.</li><li>La agencia publica un proyecto con presupuesto.</li><li>El artista envía su propuesta y la agencia elige.</li></ol>`;
  $('#a').onclick=()=>setTab(session?'proyectos':'entrar');
  v.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();setTab(a.dataset.go);});
}
function enter(v,mode='register',note=''){
  if(session){v.innerHTML='<h2>Sesión iniciada</h2><div class="row"><button class="btn" id="p">Mi perfil</button></div>';$('#p').onclick=()=>setTab('perfil');return;}
  v.innerHTML=`<h2>${mode==='register'?'Crear cuenta':'Entrar'}</h2>
  <div class="row"><button class="btn ${mode==='register'?'':'sec'}" id="m1">Crear cuenta</button><button class="btn ${mode==='login'?'':'sec'}" id="m2">Ya tengo cuenta</button></div>${note}
  <form id="f">${mode==='register'?`<label>Nombre<input name="name" required minlength="2" autocomplete="name"></label><label>Soy<select name="role"><option value="artist">Artista</option><option value="agency">Agencia, empresa o particular</option></select></label>`:''}
  <label>Correo<input name="email" type="email" required autocomplete="email"></label>
  <label>Contraseña${mode==='register'?' (mínimo 12 caracteres)':''}<input name="password" type="password" required minlength="${mode==='register'?12:1}" autocomplete="${mode==='register'?'new-password':'current-password'}"></label>
  <div id="e"></div><button class="btn" type="submit">${mode==='register'?'Crear cuenta':'Entrar'}</button></form>`;
  $('#m1').onclick=()=>enter(v,'register');$('#m2').onclick=()=>enter(v,'login');
  $('#f').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const b=e.target.querySelector('button[type=submit]');b.disabled=true;b.textContent='Un momento…';$('#e').innerHTML='';
    try{
      if(mode==='register'){const r=await call('/api/auth/register',{method:'POST',body:{email:f.email,password:f.password,name:f.name,role:f.role}});enter(v,'login',msg('info',((r&&r.message)||'Revisa tu correo para confirmar la cuenta.')+' Después de confirmar, vuelve aquí y entra.'));}
      else{const r=await call('/api/auth/login',{method:'POST',body:{email:f.email,password:f.password}});session=r.session;me=null;setTab('perfil');}
    }catch(x){$('#e').innerHTML=msg('err',x.message);b.disabled=false;b.textContent=mode==='register'?'Crear cuenta':'Entrar';}};
}

  <div class="card"><p>Titular: <span class="ph">[TITULAR: pendiente]</span></p><p>IBAN: <span class="ph">[IBAN: pendiente]</span></p><p>Contacto para el justificante: <span class="ph">[CORREO DE CONTACTO: pendiente]</span></p></div>

const STAT={pending:'Pendiente',accepted:'Aceptada',rejected:'Rechazada'};
function proposalsView(v){loading(v,async()=>{
  const m=await getMe();
  const [ps,po,pc]=await Promise.all([call('/api/proposals',{auth:true}),call('/api/projects',{auth:true}),call('/api/projects?status=closed',{auth:true})]);
  const proj=Object.fromEntries([...po,...pc].map(x=>[x.id,x]));
  const agency=m.role==='agency';
  const names={};
  if(agency)await Promise.all([...new Set(ps.map(x=>x.artist_id))].map(async id=>{try{names[id]=(await call('/api/profiles/'+encodeURIComponent(id),{auth:true})).name;}catch{names[id]='Artista';}}));
  v.innerHTML=`<h2>${agency?'Propuestas recibidas':'Mis propuestas'}</h2>`+(ps.length?ps.map(x=>`<div class="card"><h3>${esc(proj[x.project_id]?.title||'Proyecto')}</h3><div class="meta">${agency?'De '+esc(names[x.artist_id])+' · ':''}${esc(STAT[x.status]||x.status)}${x.amount_eur!=null?' · '+esc(x.amount_eur)+' €':''} · ${esc(String(x.created_at).slice(0,10))}</div><p>${esc(x.message)}</p>${agency&&x.status==='pending'?`<div class="row"><button class="btn" data-d="accepted" data-id="${esc(x.id)}">Aceptar</button><button class="btn sec" data-d="rejected" data-id="${esc(x.id)}">Rechazar</button></div>`:''}</div>`).join(''):`<p>${agency?'Todavía no has recibido propuestas.':'Todavía no has enviado propuestas.'}</p>`);
  v.querySelectorAll('button[data-d]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await call('/api/proposals/'+encodeURIComponent(b.dataset.id)+'/status',{method:'PATCH',auth:true,body:{status:b.dataset.d}});proposalsView(v);}catch(e){b.disabled=false;v.insertAdjacentHTML('afterbegin',msg('err',e.message));}});
});}
async function getMe(){if(!me)me=await call('/api/me',{auth:true});return me;}
async function loading(v,fn){v.innerHTML='<p role="status">Cargando… (la primera vez puede tardar hasta 1 minuto)</p>';try{await fn();}catch(x){v.innerHTML=msg('err',x.message);}}
const SOCIALS=[['instagram','Instagram'],['facebook','Facebook'],['tiktok','TikTok'],['youtube','YouTube'],['soundcloud','SoundCloud'],['linkedin','LinkedIn'],['website','Web']];
const isUrl=u=>/^https:\/\//.test(u||'')||(/^http:\/\//.test(u||'')); 
function socialLinks(p){const l=SOCIALS.filter(([k])=>isUrl(p[k])).map(([k,n])=>`<a href="${esc(p[k])}" target="_blank" rel="noopener nofollow">${n}</a>`);
  if(isUrl(p.portfolio_url))l.push(`<a href="${esc(p.portfolio_url)}" target="_blank" rel="noopener nofollow">Portfolio</a>`);return l.length?`<div class="links">${l.join('')}</div>`:'';}
const avatar=p=>p.avatar_url?`<img class="avatar" src="${esc(p.avatar_url)}" alt="" loading="lazy">`:`<div class="avatar" aria-hidden="true"></div>`;
function mediaHtml(media,editable){
  const ph=media.filter(m=>m.kind==='photo'),vi=media.filter(m=>m.kind==='video');
  const del=m=>editable?`<button data-del="${esc(m.id)}" aria-label="Borrar">Borrar</button>`:'';
  const photos=ph.length?`<div class="grid">${ph.map(m=>`<figure><img src="${esc(m.url)}" alt="${esc(m.caption||'Foto')}" loading="lazy">${del(m)}</figure>`).join('')}</div>`:'';
  const videos=vi.map(m=>`<div class="card">${m.embed?`<div class="video"><iframe src="${esc(m.embed)}" title="${esc(m.caption||'Vídeo')}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>`:`<a href="${esc(m.url)}" target="_blank" rel="noopener nofollow">${esc(m.caption||m.url)}</a>`}${m.caption&&m.embed?`<div class="meta">${esc(m.caption)}</div>`:''}${editable?`<div class="row"><button class="btn sec" data-del="${esc(m.id)}">Borrar vídeo</button></div>`:''}</div>`).join('');
  return {photos,videos,nPhotos:ph.length,nVideos:vi.length};
}
function artists(v){loading(v,async()=>{const a=await call('/api/artists',{auth:true});
  v.innerHTML='<h2>Artistas</h2>'+(a.length?a.map(x=>`<div class="card"><div class="head">${avatar(x)}<div><h3>${esc(x.name)}</h3><div class="meta">${esc((x.disciplines||[]).join(', '))}${x.location?' · '+esc(x.location):''}</div></div></div>${x.bio?`<p>${esc(x.bio)}</p>`:''}${socialLinks(x)}<div class="row"><button class="btn sec" data-p="${esc(x.id)}">Ver perfil completo</button></div></div>`).join(''):'<p>Todavía no hay artistas con perfil.</p>');
  v.querySelectorAll('button[data-p]').forEach(b=>b.onclick=()=>viewProfile(v,b.dataset.p));});}
function viewProfile(v,id){loading(v,async()=>{const p=await call('/api/profiles/'+encodeURIComponent(id),{auth:true});const m=mediaHtml(p.media,false);
  v.innerHTML=`<p><button class="btn sec" id="back">← Volver</button></p><div class="head">${avatar(p)}<div><h2 style="margin:0">${esc(p.name)}</h2><div class="meta">${esc((p.disciplines||[]).join(', '))}${p.location?' · '+esc(p.location):''}</div></div></div>${p.bio?`<p>${esc(p.bio)}</p>`:''}${socialLinks(p)}${m.photos?'<h2>Fotos</h2>'+m.photos:''}${m.videos?'<h2>Vídeos</h2>'+m.videos:''}${!m.photos&&!m.videos?'<p class="meta">Este perfil todavía no tiene fotos ni vídeos.</p>':''}`;
  $('#back').onclick=()=>artists(v);});}
function projects(v){loading(v,async()=>{const [p,m]=await Promise.all([call('/api/projects',{auth:true}),getMe()]);
  v.innerHTML='<h2>Proyectos abiertos</h2>'+(m.role==='artist'&&m.plan==='free'?`<p class="meta">Propuestas gratis usadas: ${Math.min(m.proposals_sent,1)} de 1.</p>`:'')+(p.length?p.map((x,i)=>`<div class="card"><h3>${esc(x.title)}</h3><div class="meta">${esc((x.disciplines||[]).join(', '))}${x.location?' · '+esc(x.location):''}${x.budget_eur!=null?' · '+esc(x.budget_eur)+' €':''}</div><p>${esc(x.description)}</p>${m.role==='artist'?`<button class="btn" data-i="${i}">Enviar propuesta</button><div id="pf${i}"></div>`:''}</div>`).join(''):'<p>No hay proyectos abiertos todavía.</p>');
  v.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>{const x=p[b.dataset.i],box=$('#pf'+b.dataset.i);if(m.plan==='free'&&m.proposals_sent>=1){box.innerHTML=payBox();return;}
    box.innerHTML=`<form><label>Tu propuesta<textarea name="message" required minlength="10" rows="4"></textarea></label><label>Importe en € (opcional)<input name="amount" type="number" min="0"></label><div class="e"></div><button class="btn" type="submit">Enviar</button></form>`;b.style.display='none';
    box.querySelector('form').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
      try{await call('/api/proposals',{method:'POST',auth:true,body:{project_id:x.id,message:f.message,amount_eur:f.amount?Number(f.amount):null}});me=null;box.innerHTML=msg('ok','Propuesta enviada. La agencia la verá.'+(m.plan==='free'?' Era tu propuesta gratis; para la siguiente necesitarás el plan de pago.':''));b.style.display='none';m.proposals_sent=(m.proposals_sent||0)+1;}
      catch(err){if(err.status===402){box.innerHTML=payBox();m.proposals_sent=Math.max(m.proposals_sent||0,1);}else e.target.querySelector('.e').innerHTML=msg('err',err.message);}};});});}
function publish(v){loading(v,async()=>{const m=await getMe();
  if(m.role!=='agency'){v.innerHTML='<h2>Publicar un proyecto</h2><p>Solo las agencias publican proyectos.</p>';return;}
  v.innerHTML=`<h2>Publicar un proyecto</h2><form id="f"><label>Título<input name="title" required minlength="3"></label><label>Descripción<textarea name="description" required minlength="10" rows="4"></textarea></label><label>Disciplinas (separadas por comas)<input name="disciplines"></label><label>Ciudad<input name="location"></label><label>Presupuesto en €<input name="budget" type="number" min="0"></label><div id="e"></div><button class="btn" type="submit">Publicar</button></form>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
    try{await call('/api/projects',{method:'POST',auth:true,body:{title:f.title,description:f.description,disciplines:list(f.disciplines),location:f.location,budget_eur:f.budget?Number(f.budget):null}});v.innerHTML=msg('ok','Proyecto publicado. Ya aparece en Proyectos.');}
    catch(err){$('#e').innerHTML=msg('err',err.message);}};});}
// Reduce la foto en el navegador (máx. 1600 px, JPEG) antes de subirla: así caben muchas en el almacén gratuito.
async function shrink(file){
  if(!/^image\//.test(file.type))throw new Error('Elige un archivo de imagen (JPG, PNG o WebP).');
  let bmp;try{bmp=await createImageBitmap(file);}catch{throw new Error('No se puede leer esa imagen. Prueba con una foto JPG.');}
  const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));if(!blob)throw new Error('No se pudo preparar la foto.');
  return await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=()=>ko(new Error('No se pudo leer la foto.'));fr.readAsDataURL(blob);});
}
function profile(v){loading(v,async()=>{const m=await getMe();const full=await call('/api/profiles/'+encodeURIComponent(m.id),{auth:true});const md=mediaHtml(full.media,true);
  v.innerHTML=`<h2>Mi perfil</h2>${m.role==='artist'?`<p class="meta">Plan: ${m.plan==='free'?'gratuito (1 propuesta gratis, usadas: '+Math.min(m.proposals_sent,1)+')':'de pago, propuestas sin límite'}</p>`:''}
  <div class="head">${avatar(m)}<div><label>Foto de perfil<input type="file" id="av" accept="image/*"></label></div></div><div id="ae"></div>
  <form id="f"><label>Nombre<input name="name" required minlength="2" value="${esc(m.name)}"></label><label>Sobre mí<textarea name="bio" rows="4">${esc(m.bio)}</textarea></label><label>Disciplinas (separadas por comas)<input name="disciplines" value="${esc((m.disciplines||[]).join(', '))}"></label><label>Ciudad<input name="location" value="${esc(m.location)}"></label><label>Enlace a tu portfolio (https://…)<input name="portfolio_url" value="${esc(m.portfolio_url)}"></label>
  <h3 style="margin:8px 0 0">Redes</h3>${SOCIALS.map(([k,n])=>`<label>${n}${k==='website'?' (https://…)':' (enlace completo, https://…)'}<input name="${k}" type="url" value="${esc(m[k])}" placeholder="https://"></label>`).join('')}
  <div id="e"></div><button class="btn" type="submit">Guardar</button></form>
  <div class="sect"><h2>Fotos (${md.nPhotos}/8)</h2>${md.photos||'<p class="meta">Aún no has subido fotos.</p>'}<label>Añadir foto<input type="file" id="ph" accept="image/*"></label><div id="pe"></div></div>
  <div class="sect"><h2>Vídeos (${md.nVideos}/5)</h2>${md.videos||'<p class="meta">Aún no has añadido vídeos.</p>'}<form id="vf"><label>Enlace de YouTube, Vimeo, Instagram, Facebook o TikTok<input name="url" type="url" required placeholder="https://"></label><button class="btn" type="submit">Añadir vídeo</button><div id="ve"></div></form></div>
  <div class="row"><button class="btn sec" id="out">Salir</button></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const body={name:f.name,bio:f.bio,disciplines:list(f.disciplines),location:f.location,portfolio_url:f.portfolio_url};SOCIALS.forEach(([k])=>body[k]=(f[k]||'').trim());
    try{me=await call('/api/me',{method:'PATCH',auth:true,body});$('#e').innerHTML=msg('ok','Guardado.');}catch(err){$('#e').innerHTML=msg('err',err.message);}};
  const busy=(id,t)=>{$(id).innerHTML=msg('info',t);};
  $('#av').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('#ae','Subiendo foto…');try{const image=await shrink(f);await call('/api/me/avatar',{method:'POST',auth:true,body:{image}});me=null;profile(v);}catch(err){$('#ae').innerHTML=msg('err',err.message);}};
  $('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('#pe','Subiendo foto…');try{const image=await shrink(f);await call('/api/media/photo',{method:'POST',auth:true,body:{image}});profile(v);}catch(err){$('#pe').innerHTML=msg('err',err.message);}};
  $('#vf').onsubmit=async e=>{e.preventDefault();const url=new FormData(e.target).get('url');try{await call('/api/media/video',{method:'POST',auth:true,body:{url}});profile(v);}catch(err){$('#ve').innerHTML=msg('err',err.message);}};
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Borrar?'))return;try{await call('/api/media/'+encodeURIComponent(b.dataset.del),{method:'DELETE',auth:true});profile(v);}catch(err){alert(err.message);}});
  $('#out').onclick=async()=>{try{await call('/api/auth/logout',{method:'POST',auth:true,body:{refresh_token:session.refresh_token}});}catch{}session=null;me=null;setTab('inicio');};});}
call('/health').catch(()=>{});
render();
</script>
