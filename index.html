<body>
<header>
  <div class="bar"><a class="brand" href="/" aria-label="TengoBolo, inicio"><img src="logo.png" alt="TengoBolo" width="68" height="67"><h1 class="sr">TengoBolo</h1></a><span class="zone" id="zone">Creativa Network</span></div>

</header>
<main id="view"></main>
<footer><p>Versión piloto de TengoBolo · Creativa Network. </p></footer>
<script>
const API='https://bolo-backend-pd6z.onrender.com';
const GCOL=['#8e7cd0','#2fb3bc','#d4a58a','#b5522f','#f09fb5','#141414','#6f8f5f','#d8a93a','#9a9a9a'];
function groupsHtml(){return '<div class="groups">'+DISC.filter(g=>g[0]!=='Otras').map((g,i)=>`<section class="gc" style="--gc:${GCOL[i%GCOL.length]}"><small>${String(i+1).padStart(2,'0')}</small><h3>${g[0]}</h3><div class="chips">${g[1].map(x=>`<button type="button" class="chip" data-d="${esc(x)}">${esc(x)}</button>`).join('')}</div></section>`).join('')+'</div>';}
function freeBanner(){return `<div class="promo"><b>Artistas: gratis, siempre.</b> Agencias, empresas y particulares: alta y primer bolo gratis; después, suscripción mensual de 15 €, sin comisión (<a href="#" data-go="precios">ver Precios</a>).</div>`;}
function payBox(){return `<div class="promo"><b>Tu primer bolo era gratis.</b> Para publicar más bolos necesitas el plan Cliente: 15 € al mes o 150 € al año, sin comisión (<a href="#" data-go="precios">ver Precios</a>).
  <ol><li>Haz una transferencia: titular <span class="ph">[TITULAR: pendiente]</span>, IBAN <span class="ph">[IBAN: pendiente]</span>.</li><li>Concepto: <b>TengoBolo + el correo de tu cuenta + plan Cliente</b>.</li><li>Escríbenos con el justificante a <span class="ph">[CORREO DE CONTACTO: pendiente]</span> y activaremos tu cuenta.</li></ol></div>`;}
let session=null, me=null, tab='inicio';
const RK='tb_rt';
function keep(){try{if(session&&session.refresh_token)localStorage.setItem(RK,session.refresh_token);else localStorage.removeItem(RK);}catch{}}
async function restore2(){try{const r=await fetch(API+'/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:session.refresh_token})});if(r.ok){const d=await r.json();session=d.session;keep();}}catch{}}
async function restore(){let t=null;try{t=localStorage.getItem(RK);}catch{}if(!t)return;try{const r=await fetch(API+'/api/auth/refresh',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({refresh_token:t})});if(!r.ok){if(r.status===401){try{localStorage.removeItem(RK);}catch{}}return;}const d=await r.json();session=d.session;keep();}catch{}}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DISC=[["Música", ["Cantante", "Cantante de ópera", "Cantautor/a", "Coro", "Banda de versiones", "Orquesta de baile / verbena", "Dúo o trío acústico", "Pianista", "Guitarrista", "Violín y cuerdas", "Cuarteto / orquesta de cámara", "Música clásica", "Jazz", "Flamenco (cante y guitarra)", "Rumba", "Mariachi", "Gospel", "Tributo a un artista", "Rap / hip hop", "Beatbox", "DJ", "Karaoke", "Música de calle"]], ["Teatro e interpretación", ["Interpretación (actor/actriz)", "Teatro", "Teatro infantil", "Monólogo / humor", "Improvisación", "Títeres y marionetas", "Cuentacuentos", "Narrador/a", "Locución y doblaje", "Presentador/a / maestro de ceremonias"]], ["Danza", ["Danza contemporánea", "Ballet clásico", "Flamenco (baile)", "Danza oriental", "Bailes latinos", "Tango", "Swing", "Danza urbana / breakdance", "Sardana y danza tradicional", "Bailarines de espectáculo"]], ["Circo y variedades", ["Magia", "Mentalismo", "Payaso / clown", "Malabares", "Acrobacia", "Zancudos", "Show de fuego", "Aéreos (telas, aro)", "Contorsionismo", "Mimo", "Estatua viva", "Ventriloquia", "Globoflexia", "Cabaret / burlesque", "Transformismo / drag"]], ["Animación y eventos", ["Animador/a infantil", "Animador/a de eventos", "Personajes y disfraces", "Pintacaras", "Espectáculo infantil", "Fiesta temática"]], ["Artes plásticas", ["Pintura", "Escultura", "Muralismo / graffiti", "Ilustración", "Caricaturista en vivo", "Retratista", "Cerámica", "Artesanía", "Arte floral", "Body painting", "Performance artística", "Arte digital"]], ["Imagen y audiovisual", ["Fotografía", "Fotografía de eventos", "Vídeo", "Videoclip", "Cine y cortometraje", "Animación", "VJ / visuales", "Drones", "Diseño gráfico", "Diseño de moda"]], ["Palabra", ["Poesía", "Spoken word", "Escritura"]], ["Otras", ["Otro"]]];const DISC_ALL=DISC.flatMap(g=>g[1]);
const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
async function call(path,{method='GET',body,auth}={}){
  let r;
  try{r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(auth&&session?{Authorization:'Bearer '+session.access_token}:{})},body:body===undefined?undefined:JSON.stringify(body)});}
  catch{throw new Error('No se pudo conectar con el servidor. Si estaba dormido, espera 1 minuto y vuelve a intentarlo.');}
  if(r.status===401&&auth&&session&&!arguments[1]._r){const old=session;await restore2();if(session&&session!==old)return call(path,{method,body,auth,_r:1});}
  if(r.status===204)return null;
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const er=new Error(d.error||'Algo ha fallado. Inténtalo de nuevo.');er.status=r.status;throw er;}
  return d;
}
function setTab(t){tab=t;render();window.scrollTo(0,0);}

  $('#nav').innerHTML=items.map(([k,l])=>`<button data-t="${k}" ${tab===k?'aria-current="true"':''}>${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
}
function msg(kind,text){return `<div class="msg ${kind}" role="status">${esc(text)}</div>`;}
function needLogin(){return `<h2>Necesitas entrar</h2><p>Para ver esto, crea tu cuenta o entra.</p><div class="row"><button class="btn" id="go">Crear cuenta o entrar</button></div>`;}
async function render(){
  renderNav();const v=$('#view');
  if(['artistas','proyectos','publicar','propuestas','perfil'].includes(tab)&&!session){v.innerHTML=needLogin();$('#go').onclick=()=>setTab('entrar');return;}
  if(tab==='inicio')return home(v);
  if(tab==='entrar')return enter(v);
  if(tab==='precios')return pricing(v);
  if(tab==='quienes')return about(v);

      try{await call('/api/proposals',{method:'POST',auth:true,body:{project_id:x.id,message:f.message,amount_eur:f.amount?Number(f.amount):null,insurance_confirmed:!!f.ins}});me=null;box.innerHTML=msg('ok','Propuesta enviada. El cliente la verá.');b.style.display='none';}
      catch(err){e.target.querySelector('.e').innerHTML=msg('err',err.message);}};};});bind();
  const more=$('#more');if(more)more.onclick=async()=>{more.disabled=true;try{page++;const n=await call('/api/projects'+qs(q,page),{auth:true});const base=all.length;all.push(...n);$('#res').insertAdjacentHTML('beforeend',n.map((x,i)=>card(x,base+i)).join(''));bind();if(n.length<20)more.remove();else more.disabled=false;}catch(err){more.disabled=false;}};});}
function publish(v){loading(v,async()=>{const m=await getMe();

  const today=new Date().toISOString().slice(0,10);

  v.innerHTML=`<h2>Publicar un bolo</h2><p class="steps" id="st"></p>
  <form id="f" novalidate>
  <fieldset data-s="0"><h3>1. Qué y dónde</h3>
    <label>Título del bolo<input name="title" required minlength="3" maxlength="150" placeholder="Ej: Música en directo para una boda"></label>

  <fieldset data-s="1" hidden><h3>2. Fechas y dinero</h3>
    <label>Fecha del bolo<input name="event_date" type="date" required min="${today}"></label>
    <label>Fecha límite para recibir propuestas (opcional)<input name="deadline" type="date" min="${today}"></label>
    <label>Presupuesto en € (opcional)<input name="budget" type="number" min="0"></label></fieldset>
  <fieldset data-s="2" hidden><h3>3. Extras y requisitos</h3>
    <p class="meta">Marca lo que ofreces:</p>
    <label class="chk"><input type="checkbox" name="x_equipo"> Equipo de sonido/luz</label>
    <label class="chk"><input type="checkbox" name="x_transporte"> Transporte</label>
    <label class="chk"><input type="checkbox" name="x_alojamiento"> Alojamiento</label>
    <label>Rider (necesidades técnicas, opcional)<textarea name="rider" rows="4" maxlength="3000" placeholder="Ej: 2 micros, escenario de 3x2 m..."></textarea></label>
    <label class="chk"><input type="checkbox" name="ins"> Exijo que el artista tenga seguro de responsabilidad civil</label></fieldset>
  <fieldset data-s="3" hidden><h3>4. Contacto privado</h3>
    <p class="meta">Solo lo verán tú y el artista cuya propuesta aceptes. Nadie más.</p>
    <label>Teléfono<input name="phone" type="tel" maxlength="25" autocomplete="tel"></label>
    <label>Dirección del bolo<input name="address" maxlength="300"></label></fieldset>
  <div id="e"></div>
  <div class="row"><button class="btn sec" type="button" id="bk">Atrás</button><button class="btn" type="button" id="nx">Siguiente</button><button class="btn" type="submit" id="ok" hidden>Publicar bolo</button></div></form>`;
  let step=0;const fs=[...v.querySelectorAll('fieldset')];
  const show=()=>{fs.forEach((x,i)=>x.hidden=i!==step);$('#st').textContent=`Paso ${step+1} de ${fs.length}`;$('#bk').hidden=step===0;$('#nx').hidden=step===fs.length-1;$('#ok').hidden=step!==fs.length-1;$('#e').innerHTML='';window.scrollTo(0,0);};
  $('#bk').onclick=()=>{step--;show();};
  $('#nx').onclick=()=>{const bad=[...fs[step].querySelectorAll('input,textarea,select')].find(i=>!i.checkValidity());if(bad){bad.reportValidity();return;}step++;show();};
  show();
  $('#f').onsubmit=async e=>{e.preventDefault();if(step<fs.length-1){$('#nx').click();return;}const f=Object.fromEntries(new FormData(e.target));
    const dl=f.deadline||null;if(dl&&dl>f.event_date){$('#e').innerHTML=msg('err','La fecha límite no puede ser posterior al bolo.');return;}

      v.innerHTML=msg('ok','Bolo publicado. Ya aparece en Proyectos. Cuando aceptes una propuesta, el artista verá tu teléfono y dirección.');}

// Reduce la foto en el navegador (máx. 1600 px, JPEG) antes de subirla: así caben muchas en el almacén gratuito.
async function shrink(file){
  if(!/^image\//.test(file.type))throw new Error('Elige un archivo de imagen (JPG, PNG o WebP).');
  let bmp;try{bmp=await createImageBitmap(file);}catch{throw new Error('No se puede leer esa imagen. Prueba con una foto JPG.');}
  const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));if(!blob)throw new Error('No se pudo preparar la foto.');
  return await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=()=>ko(new Error('No se pudo leer la foto.'));fr.readAsDataURL(blob);});
}
function profile(v){loading(v,async()=>{const m=await getMe();const full=await call('/api/profiles/'+encodeURIComponent(m.id),{auth:true});const md=mediaHtml(full.media,true);
  v.innerHTML=`<h2>Mi perfil</h2><p class="meta">${m.role==='artist'?'Plan: gratuito, propuestas sin límite':(m.plan==='free'?'Plan: gratuito (primer bolo gratis)':'Plan Cliente: bolos ilimitados')}</p>
  <div class="head">${avatar(m)}<div><label>Foto de perfil<input type="file" id="av" accept="image/*"></label></div></div><div id="ae"></div>
  <form id="f"><label>Nombre<input name="name" required minlength="2" value="${esc(m.name)}"></label><label>Sobre mí<textarea name="bio" rows="4">${esc(m.bio)}</textarea></label><div><b>Disciplinas</b> <span class="meta">(máximo 12)</span>${DISC.map(g=>`<details class="dg"${g[1].some(x=>(m.disciplines||[]).includes(x))?' open':''}><summary>${g[0]}</summary>${g[1].map(x=>`<label><input type="checkbox" name="d" value="${esc(x)}"${(m.disciplines||[]).includes(x)?' checked':''}>${x}</label>`).join('')}</details>`).join('')}</div><label>Otras disciplinas (opcional, separadas por comas)<input name="disciplines_other" value="${esc((m.disciplines||[]).filter(x=>!DISC_ALL.includes(x)).join(', '))}"></label><label>Ciudad<input name="location" value="${esc(m.location)}"></label><label>Enlace a tu portfolio (https://…)<input name="portfolio_url" value="${esc(m.portfolio_url)}"></label>
  <h3 style="margin:8px 0 0">Redes</h3>${SOCIALS.map(([k,n])=>`<label>${n}${k==='website'?' (https://…)':' (enlace completo, https://…)'}<input name="${k}" type="url" value="${esc(m[k])}" placeholder="https://"></label>`).join('')}
  <div id="e"></div><button class="btn" type="submit">Guardar</button></form>
  <div class="sect"><h2>Fotos (${md.nPhotos}/8)</h2>${md.photos||'<p class="meta">Aún no has subido fotos.</p>'}<label>Añadir foto<input type="file" id="ph" accept="image/*"></label><div id="pe"></div></div>
  <div class="sect"><h2>Vídeos (${md.nVideos}/5)</h2>${md.videos||'<p class="meta">Aún no has añadido vídeos.</p>'}<form id="vf"><label>Enlace de YouTube, Vimeo, Instagram, Facebook o TikTok<input name="url" type="url" required placeholder="https://"></label><button class="btn" type="submit">Añadir vídeo</button><div id="ve"></div></form></div>
  <div class="row"><button class="btn sec" id="out">Salir</button></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const body={name:f.name,bio:f.bio,disciplines:[...new Set([...[...e.target.querySelectorAll('input[name=d]:checked')].map(x=>x.value),...list(f.disciplines_other||'')])],location:f.location,portfolio_url:f.portfolio_url};SOCIALS.forEach(([k])=>body[k]=(f[k]||'').trim());
    if(body.disciplines.length>12){$('#e').innerHTML=msg('err','Máximo 12 disciplinas. Quita alguna.');return;}
    if(body.disciplines.some(x=>x.length>60)){$('#e').innerHTML=msg('err','Cada disciplina puede tener como máximo 60 letras.');return;}
    try{me=await call('/api/me',{method:'PATCH',auth:true,body});$('#e').innerHTML=msg('ok','Guardado.');}catch(err){$('#e').innerHTML=msg('err',err.message);}};
  const busy=(id,t)=>{$(id).innerHTML=msg('info',t);};
  $('#av').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('#ae','Subiendo foto…');try{const image=await shrink(f);await call('/api/me/avatar',{method:'POST',auth:true,body:{image}});me=null;profile(v);}catch(err){$('#ae').innerHTML=msg('err',err.message);}};
  $('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('#pe','Subiendo foto…');try{const image=await shrink(f);await call('/api/media/photo',{method:'POST',auth:true,body:{image}});profile(v);}catch(err){$('#pe').innerHTML=msg('err',err.message);}};
  $('#vf').onsubmit=async e=>{e.preventDefault();const url=new FormData(e.target).get('url');try{await call('/api/media/video',{method:'POST',auth:true,body:{url}});profile(v);}catch(err){$('#ve').innerHTML=msg('err',err.message);}};
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Borrar?'))return;try{await call('/api/media/'+encodeURIComponent(b.dataset.del),{method:'DELETE',auth:true});profile(v);}catch(err){alert(err.message);}});
  $('#out').onclick=async()=>{try{await call('/api/auth/logout',{method:'POST',auth:true,body:{refresh_token:session.refresh_token}});}catch{}session=null;keep();me=null;setTab('inicio');};});}

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;setupInstall();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;const b=document.getElementById('appbox');if(b)b.hidden=true;});
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function setupInstall(){
  const box=document.getElementById('appbox');if(!box||isStandalone())return;
  box.hidden=false;
  const btn=document.getElementById('inst'),how=document.getElementById('how');
  const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua),android=/android/i.test(ua);
  btn.onclick=async()=>{
    if(deferredInstall){try{deferredInstall.prompt();await deferredInstall.userChoice;}catch{}deferredInstall=null;return;}
    how.hidden=false;
    how.style.cssText='background:#f5f1ea;border-radius:6px;padding:12px 14px;color:#141414';
    const mac=/macintosh/i.test(ua)&&!ios&&!/chrome|chromium|edg/i.test(ua);
    how.innerHTML=ios?'<b>En iPhone o iPad (Safari):</b><ol><li>Pulsa el botón Compartir (el cuadrado con la flecha hacia arriba).</li><li>Elige "Añadir a pantalla de inicio".</li><li>Pulsa "Añadir". Ya tienes el icono del corazón en tu móvil.</li></ol>'
    :mac?'<b>En Mac (Safari):</b><ol><li>En el menú de arriba, pulsa Archivo.</li><li>Elige "Añadir al Dock".</li><li>Pulsa "Añadir". Ya tienes TengoBolo como app en el Dock.</li></ol>'
    :(/chrome|edg/i.test(ua)&&!android)?'<b>En Chrome o Edge del ordenador:</b><ol><li>Mira a la derecha de la barra de direcciones: aparece un icono de instalar (una pantalla con una flecha).</li><li>Si no lo ves, abre el menú de tres puntos, ve a "Enviar, guardar y compartir" (o "Guardar y compartir") y elige "Instalar TengoBolo".</li><li>Si ya la instalaste antes, ábrela desde Aplicaciones o el Launchpad: Chrome no vuelve a ofrecerla.</li></ol>'
    :android?'<b>En Android (Chrome):</b><ol><li>Pulsa los tres puntos arriba a la derecha.</li><li>Elige "Instalar aplicación" o "Añadir a pantalla de inicio".</li><li>Confirma. Ya tienes el icono del corazón en tu móvil.</li></ol>'
    :'<b>Así se instala en tu dispositivo:</b><ul><li><b>iPhone o iPad:</b> abre esta web en Safari, pulsa Compartir y "Añadir a pantalla de inicio".</li><li><b>Mac con Safari:</b> menú Archivo y "Añadir al Dock".</li><li><b>Android:</b> en Chrome, menú de tres puntos e "Instalar aplicación".</li><li><b>Ordenador con Chrome o Edge:</b> icono de instalar a la derecha de la barra de direcciones.</li></ul>';
    how.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
}
