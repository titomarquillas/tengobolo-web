<style>
:root{--ink:#241a14;--ink2:#6b5646;--bg:#fbf6ee;--card:#fff;--line:#e8dccb;--accent:#c8641a;--accent2:#8a3f0e;--tint:#fff3e0;--sun:#ffc929;--font:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

html{scroll-behavior:smooth}

.st5 .n{flex:none;width:46px;height:46px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:22px;display:grid;place-items:center;transform:rotate(-6deg)}

<body>
<header>
  <div class="bar"><a class="brand" href="/" aria-label="TengoBolo, inicio"><img src="logo.png" alt="TengoBolo" width="68" height="67"><h1 class="sr">TengoBolo</h1></a><span class="zone" id="zone">Creativa Network</span></div>
  <nav aria-label="Secciones" id="nav"></nav>
</header>
<main id="view"></main>
<footer><p>Versión piloto de TengoBolo · Creativa Network. Si recargas la página tendrás que volver a entrar.</p></footer>
<script>
const API='https://bolo-backend-pd6z.onrender.com';
function freeBanner(){return `<div class="promo"><b>Registro gratis para todos.</b> Los artistas envían su primera propuesta gratis; a partir de la segunda hace falta un plan de pago desde 5 € al mes (<a href="#" data-go="precios">ver Precios</a>).</div>`;}
function payBox(){return `<div class="promo"><b>Tu primera propuesta era gratis.</b> Para enviar más propuestas necesitas el plan Artista: 5 € al mes o 50 € al año (<a href="#" data-go="precios">ver Precios</a>).
  <ol><li>Haz una transferencia: titular <span class="ph">[TITULAR: pendiente]</span>, IBAN <span class="ph">[IBAN: pendiente]</span>.</li><li>Concepto: <b>TengoBolo + el correo de tu cuenta + plan</b>.</li><li>Escríbenos con el justificante a <span class="ph">[CORREO DE CONTACTO: pendiente]</span> y activaremos tu cuenta.</li></ol></div>`;}
let session=null, me=null, tab='inicio';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const list=s=>s.split(',').map(x=>x.trim()).filter(Boolean);
async function call(path,{method='GET',body,auth}={}){
  let r;
  try{r=await fetch(API+path,{method,headers:{'Content-Type':'application/json',...(auth&&session?{Authorization:'Bearer '+session.access_token}:{})},body:body===undefined?undefined:JSON.stringify(body)});}
  catch{throw new Error('No se pudo conectar con el servidor. Si estaba dormido, espera 1 minuto y vuelve a intentarlo.');}
  if(r.status===204)return null;
  const d=await r.json().catch(()=>({}));
  if(!r.ok){const er=new Error(d.error||'Algo ha fallado. Inténtalo de nuevo.');er.status=r.status;throw er;}
  return d;
}
function setTab(t){tab=t;render();window.scrollTo(0,0);}
function renderNav(){paint();
  const items=[['inicio','Inicio'],['artistas','Artistas'],['proyectos','Proyectos'],['publicar','Publicar'],['propuestas','Propuestas'],['precios','Precios'],[session?'perfil':'entrar',session?'Mi perfil':'Entrar']];
  $('#nav').innerHTML=items.map(([k,l])=>`<button data-t="${k}" ${tab===k?'aria-current="true"':''}>${l}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
}
function msg(kind,text){return `<div class="msg ${kind}" role="status">${esc(text)}</div>`;}
function needLogin(){return `<h2>Necesitas entrar</h2><p>Para ver esto, crea tu cuenta o entra.</p><div class="row"><button class="btn" id="go">Crear cuenta o entrar</button></div>`;}
async function render(){
  renderNav();const v=$('#view');
  if(['artistas','proyectos','publicar','propuestas','perfil'].includes(tab)&&!session){v.innerHTML=needLogin();$('#go').onclick=()=>setTab('entrar');return;}
  if(tab==='inicio')return home(v);
  if(tab==='entrar')return enter(v);
  if(tab==='precios')return pricing(v);
  if(tab==='propuestas')return proposalsView(v);
  if(tab==='artistas')return artists(v);
  if(tab==='proyectos')return projects(v);
  if(tab==='publicar')return publish(v);
  if(tab==='perfil')return profile(v);
}
function home(v){
  const confirmed=/type=(signup|email)|access_token=/.test(location.hash);
  const failed=/error=|error_description=/.test(location.hash);
  if(confirmed||failed)history.replaceState(null,'',location.pathname);
  v.innerHTML=`${confirmed?msg('ok','Correo confirmado. Ya puedes entrar con tu cuenta.'):''}${failed?msg('err','El enlace del correo no es válido o ha caducado. Crea la cuenta otra vez o pide un correo nuevo.'):''}
  ${freeBanner()}

    <label>Fecha del bolo<input name="event_date" type="date" required min="${today}"></label>
    <label>Fecha límite para recibir propuestas (opcional)<input name="deadline" type="date" min="${today}"></label>
    <label>Presupuesto en € (opcional)<input name="budget" type="number" min="0"></label></fieldset>
  <fieldset data-s="2" hidden><h3>3. Extras y requisitos</h3>
    <p class="meta">Marca lo que ofreces:</p>
    <label class="chk"><input type="checkbox" name="x_equipo"> Equipo de sonido/luz</label>
    <label class="chk"><input type="checkbox" name="x_transporte"> Transporte</label>
    <label class="chk"><input type="checkbox" name="x_alojamiento"> Alojamiento</label>
    <label>Rider (necesidades técnicas, opcional)<textarea name="rider" rows="4" maxlength="3000" placeholder="Ej: 2 micros, escenario de 3x2 m..."></textarea></label>
    <label class="chk"><input type="checkbox" name="ins"> Exijo que el artista tenga seguro de responsabilidad civil</label></fieldset>
  <fieldset data-s="3" hidden><h3>4. Contacto privado</h3>
    <p class="meta">Solo lo verán tú y el artista cuya propuesta aceptes. Nadie más.</p>
    <label>Teléfono<input name="phone" type="tel" maxlength="25" autocomplete="tel"></label>
    <label>Dirección del bolo<input name="address" maxlength="300"></label></fieldset>
  <div id="e"></div>
  <div class="row"><button class="btn sec" type="button" id="bk">Atrás</button><button class="btn" type="button" id="nx">Siguiente</button><button class="btn" type="submit" id="ok" hidden>Publicar bolo</button></div></form>`;
  let step=0;const fs=[...v.querySelectorAll('fieldset')];
  const show=()=>{fs.forEach((x,i)=>x.hidden=i!==step);$('#st').textContent=`Paso ${step+1} de ${fs.length}`;$('#bk').hidden=step===0;$('#nx').hidden=step===fs.length-1;$('#ok').hidden=step!==fs.length-1;$('#e').innerHTML='';window.scrollTo(0,0);};
  $('#bk').onclick=()=>{step--;show();};
  $('#nx').onclick=()=>{const bad=[...fs[step].querySelectorAll('input,textarea,select')].find(i=>!i.checkValidity());if(bad){bad.reportValidity();return;}step++;show();};
  show();
  $('#f').onsubmit=async e=>{e.preventDefault();if(step<fs.length-1){$('#nx').click();return;}const f=Object.fromEntries(new FormData(e.target));
    const dl=f.deadline||null;if(dl&&dl>f.event_date){$('#e').innerHTML=msg('err','La fecha límite no puede ser posterior al bolo.');return;}
    const b=$('#ok');b.disabled=true;
    try{await call('/api/projects',{method:'POST',auth:true,body:{title:f.title,description:f.description,disciplines:[f.art],location:f.location,budget_eur:f.budget?Number(f.budget):null,event_date:f.event_date,deadline:dl,extras:['equipo','transporte','alojamiento'].filter(k=>f['x_'+k]),rider:f.rider||'',requires_insurance:!!f.ins,phone:f.phone||'',address:f.address||''}});
      v.innerHTML=msg('ok','Bolo publicado. Ya aparece en Proyectos. Cuando aceptes una propuesta, el artista verá tu teléfono y dirección.');}
    catch(err){b.disabled=false;$('#e').innerHTML=msg('err',err.message);}};});}
// Reduce la foto en el navegador (máx. 1600 px, JPEG) antes de subirla: así caben muchas en el almacén gratuito.
async function shrink(file){
  if(!/^image\//.test(file.type))throw new Error('Elige un archivo de imagen (JPG, PNG o WebP).');
  let bmp;try{bmp=await createImageBitmap(file);}catch{throw new Error('No se puede leer esa imagen. Prueba con una foto JPG.');}
  const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));if(!blob)throw new Error('No se pudo preparar la foto.');
  return await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=()=>ko(new Error('No se pudo leer la foto.'));fr.readAsDataURL(blob);});
}
function profile(v){loading(v,async()=>{const m=await getMe();const full=await call('/api/profiles/'+encodeURIComponent(m.id),{auth:true});const md=mediaHtml(full.media,true);
  v.innerHTML=`<h2>Mi perfil</h2>${m.role==='artist'?`<p class="meta">Plan: ${m.plan==='free'?'gratuito (1 propuesta gratis, usadas: '+Math.min(m.proposals_sent,1)+')':'de pago, propuestas sin límite'}</p>`:''}
  <div class="head">${avatar(m)}<div><label>Foto de perfil<input type="file" id="av" accept="image/*"></label></div></div><div id="ae"></div>
  <form id="f"><label>Nombre<input name="name" required minlength="2" value="${esc(m.name)}"></label><label>Sobre mí<textarea name="bio" rows="4">${esc(m.bio)}</textarea></label><label>Disciplinas (separadas por comas)<input name="disciplines" value="${esc((m.disciplines||[]).join(', '))}"></label><label>Ciudad<input name="location" value="${esc(m.location)}"></label><label>Enlace a tu portfolio (https://…)<input name="portfolio_url" value="${esc(m.portfolio_url)}"></label>
  <h3 style="margin:8px 0 0">Redes</h3>${SOCIALS.map(([k,n])=>`<label>${n}${k==='website'?' (https://…)':' (enlace completo, https://…)'}<input name="${k}" type="url" value="${esc(m[k])}" placeholder="https://"></label>`).join('')}
  <div id="e"></div><button class="btn" type="submit">Guardar</button></form>
  <div class="sect"><h2>Fotos (${md.nPhotos}/8)</h2>${md.photos||'<p class="meta">Aún no has subido fotos.</p>'}<label>Añadir foto<input type="file" id="ph" accept="image/*"></label><div id="pe"></div></div>
  <div class="sect"><h2>Vídeos (${md.nVideos}/5)</h2>${md.videos||'<p class="meta">Aún no has añadido vídeos.</p>'}<form id="vf"><label>Enlace de YouTube, Vimeo, Instagram, Facebook o TikTok<input name="url" type="url" required placeholder="https://"></label><button class="btn" type="submit">Añadir vídeo</button><div id="ve"></div></form></div>
  <div class="row"><button class="btn sec" id="out">Salir</button></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const body={name:f.name,bio:f.bio,disciplines:list(f.disciplines),location:f.location,portfolio_url:f.portfolio_url};SOCIALS.forEach(([k])=>body[k]=(f[k]||'').trim());
    try{me=await call('/api/me',{method:'PATCH',auth:true,body});$('#e').innerHTML=msg('ok','Guardado.');}catch(err){$('#e').innerHTML=msg('err',err.message);}};
  const busy=(id,t)=>{$(id).innerHTML=msg('info',t);};
  $('#av').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('#ae','Subiendo foto…');try{const image=await shrink(f);await call('/api/me/avatar',{method:'POST',auth:true,body:{image}});me=null;profile(v);}catch(err){$('#ae').innerHTML=msg('err',err.message);}};
  $('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('#pe','Subiendo foto…');try{const image=await shrink(f);await call('/api/media/photo',{method:'POST',auth:true,body:{image}});profile(v);}catch(err){$('#pe').innerHTML=msg('err',err.message);}};
  $('#vf').onsubmit=async e=>{e.preventDefault();const url=new FormData(e.target).get('url');try{await call('/api/media/video',{method:'POST',auth:true,body:{url}});profile(v);}catch(err){$('#ve').innerHTML=msg('err',err.message);}};
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Borrar?'))return;try{await call('/api/media/'+encodeURIComponent(b.dataset.del),{method:'DELETE',auth:true});profile(v);}catch(err){alert(err.message);}});
  $('#out').onclick=async()=>{try{await call('/api/auth/logout',{method:'POST',auth:true,body:{refresh_token:session.refresh_token}});}catch{}session=null;me=null;setTab('inicio');};});}
call('/health').catch(()=>{});
render();
</script>
