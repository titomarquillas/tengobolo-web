// Pagos de la suscripcion de cliente: preparados y apagados. Si el backend dice enabled:true
// (interruptor en el servidor), se muestran los precios configurados y los botones de pago.
async function loadPayCfg(){
  try{
    const r=await fetch(API+'/api/payments/config');if(!r.ok)return;const c=await r.json();
    if(session&&!me){try{await getMe();}catch{}}
    const eur=n=>String(n).replace('.',',');const P=c.prices||{};
    [['pr-s','single'],['pr-m','monthly'],['pr-a','annual'],['pr-p','pro_monthly'],['pr-pa','pro_annual']].forEach(([id,k])=>{const e=$('#'+id);if(e&&P[k])e.textContent=eur(P[k]);});
    const off=()=>'';
    const isA=session&&me&&me.role==='artist',isC=session&&me&&me.role!=='artist';
    const ent='<button class="btn" data-goentrar="1">Entra o crea tu cuenta</button>';
    const btn=(plan,label,ok)=>!session?ent:!ok?'<p class="sub">Este plan es para '+(plan.startsWith('pro')?'artistas':'clientes')+'.</p>':c.enabled?`<button class="btn" data-plan="${plan}">${label}</button>`:off(label);
    const set=(id,h)=>{const e=$('#'+id);if(e)e.innerHTML=h;};
    set('pay-m',btn('monthly','Elegir plan mensual',isC));set('pay-a',btn('annual','Elegir plan anual',isC));
    set('pay-s',!session?ent:isC?'<p class="sub">Se paga al publicar un bolo.</p>':'<p class="sub">Este plan es para clientes.</p>');
    set('pay-p',!session?ent:!isA?'<p class="sub">Este plan es para artistas.</p>':c.enabled?'<button class="btn" data-plan="pro_monthly">Pro mensual</button> <button class="btn sec" data-plan="pro_annual">Pro anual</button>':off('Hacerme Pro'));
    document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=async()=>{
      b.disabled=true;try{const d=await call('/api/payments/checkout',{method:'POST',auth:true,body:{plan:b.dataset.plan}});location.href=d.url;}
      catch(e){b.disabled=false;alert(e.message||'No se pudo preparar el pago.');}
    });
    document.querySelectorAll('[data-goentrar]').forEach(b=>b.onclick=()=>setTab('entrar'));
  }catch{}
}

function printSheet(html){
  let p=document.getElementById('print');if(!p){p=document.createElement('div');p.id='print';document.body.appendChild(p);}
  p.innerHTML=html;document.body.classList.add('printing');
  const done=()=>{document.body.classList.remove('printing');window.removeEventListener('afterprint',done);};
  window.addEventListener('afterprint',done);window.print();setTimeout(done,1500);
}

  $('#f').onsubmit=async e=>{e.preventDefault();if(step<fs.length-1){$('#nx').click();return;}const f=Object.fromEntries(new FormData(e.target));
    const dl=f.deadline||null;if(dl&&dl>f.event_date){$('#e').innerHTML=msg('err','La fecha límite no puede ser posterior al bolo.');return;}
    const discs=[...new Set([...[...e.target.querySelectorAll('input[name=art]:checked')].map(i=>i.value),...(f.art_other||'').split(',').map(x=>x.trim()).filter(Boolean)])];
    if(!discs.length){$('#e').innerHTML=msg('err','Marca al menos un tipo de arte.');return;}
    if(discs.length>12||discs.some(x=>x.length>60)){$('#e').innerHTML=msg('err','Máximo 12 tipos de arte, de hasta 60 letras cada uno.');return;}
    const b=$('#ok');b.disabled=true;
    try{await call('/api/projects',{method:'POST',auth:true,body:{title:f.title,description:fichaText(f)+f.description,disciplines:discs,location:f.location,budget_eur:f.budget?Number(f.budget):null,event_date:f.event_date,deadline:dl,extras:['equipo','transporte','alojamiento'].filter(k=>f['x_'+k]),rider:f.rider||'',requires_insurance:!!f.ins,phone:f.phone||'',address:f.address||''}});
      v.innerHTML=msg('ok','Bolo guardado. Todavía no se cobra nada, así que ya aparece en Bolos. Cuando aceptes una propuesta, el artista verá tu teléfono y dirección.');}
    catch(err){b.disabled=false;if(err.status===402){$('#e').innerHTML=payBox();}else $('#e').innerHTML=msg('err',err.message);}};});}
// Reduce la foto en el navegador (máx. 1600 px, JPEG) antes de subirla: así caben muchas en el almacén gratuito.
function fichaText(f){const r=[['Tipo de evento',f.evtype],['Espacio',f.space],['Asistentes',f.guests],['Horario',f.t_from?(f.t_from+(f.t_to?' a '+f.t_to:'')):''],['Actuación',f.dur]].filter(x=>x[1]);return r.length?r.map(x=>x[0]+': '+x[1]).join('\n')+'\n\n':'';}
async function shrink(file){
  if(!/^image\//.test(file.type))throw new Error('Elige un archivo de imagen (JPG, PNG o WebP).');
  let bmp;try{bmp=await createImageBitmap(file);}catch{throw new Error('No se puede leer esa imagen. Prueba con una foto JPG.');}
  const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));if(!blob)throw new Error('No se pudo preparar la foto.');
  return await new Promise((ok,ko)=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(',')[1]);fr.onerror=()=>ko(new Error('No se pudo leer la foto.'));fr.readAsDataURL(blob);});
}
function profile(v){loading(v,async()=>{const m=await getMe();const full=await call('/api/profiles/'+encodeURIComponent(m.id),{auth:true});const md=mediaHtml(full.media,true);
  v.innerHTML=`<h2>Mi perfil</h2><p class="meta">${m.role==='artist'?(m.pro_active?'Plan: Pro':'Plan: Basic (gratis), propuestas sin límite'):(m.plan==='free'?'Plan: sin plan contratado (todavía no se cobra)':'Plan Cliente: bolos ilimitados')}</p>
  <div class="head">${avatar(m)}<div><label>Foto de perfil<input type="file" id="av" accept="image/*"></label></div></div><div id="ae"></div>
  ${m.role==='artist'&&!m.complete?`<div class="pbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round((4-m.missing.length)/4*100)}"><div style="width:${Math.round((4-m.missing.length)/4*100)}%"></div></div><p class="meta" style="margin:4px 0 0">Perfil al ${Math.round((4-m.missing.length)/4*100)} %</p>`:''}
  ${m.role==='artist'?(m.complete?`<div class="msg ok">Tu perfil está completo y aparece en el listado de artistas.</div>`:`<div class="promo"><b>Completa tu perfil para aparecer en el listado.</b> Te falta: ${m.missing.map(esc).join(', ')}.</div>`):''}
  ${m.role==='artist'?`<p><a class="btn sec" style="display:inline-block;text-decoration:none;padding:14px 20px;line-height:1.2" target="_blank" rel="noopener" href="${waLink('Estoy en TengoBolo, la red de artistas y bolos. Échale un vistazo: '+location.origin+'/')}">Compartir TengoBolo por WhatsApp</a></p>`:''}
  ${DESTACADO&&m.role==='artist'?`<div class="promo"><b>Pro (opcional):</b> tu perfil, el primero en las listas y con la marca "Destacado", por 6 € al mes o 60 € al año (sin IVA). Basic sigue siendo gratis, siempre. <a href="#" data-go="precios">Ver Precios</a></div>`:''}
  ${m.role==='artist'?`<div class="card" style="margin:8px 0"><label class="chk" style="align-items:flex-start"><input type="checkbox" name="listed"${m.listed!==false?' checked':''} style="margin-top:4px"> <span><b>Aparecer en el listado de artistas</b><br><span class="meta">Los usuarios registrados verán solo tu nombre y tu ciudad. Tu ficha completa y el contacto solo se desbloquean para clientes que publican un bolo. Nunca se muestra tu correo ni tu teléfono: te escriben por mensajes internos. Puedes quitarlo cuando quieras.</span></span></label><label class="chk" style="align-items:flex-start;margin-top:12px"><input type="checkbox" name="showcase"${m.showcase?' checked':''} style="margin-top:4px"> <span><b>Aparecer en la portada</b><br><span class="meta">Los visitantes verán tu nombre, tu foto, tus disciplinas y tu ciudad en la sección "Artistas en la red". Nunca tu correo ni tu contacto. Puedes quitarlo cuando quieras.</span></span></label></div>`:''}
  <form id="f"><label>Nombre<input name="name" required minlength="2" value="${esc(m.name)}"></label><label>Sobre mí<textarea name="bio" rows="4">${esc(m.bio)}</textarea></label><div><b>Disciplinas artísticas</b> <span class="meta">(máximo 12)</span>${DISC.map(g=>`<details class="dg"${g[1].some(x=>(m.disciplines||[]).includes(x))?' open':''}><summary>${g[0]}</summary>${g[1].map(x=>`<label><input type="checkbox" name="d" value="${esc(x)}"${(m.disciplines||[]).includes(x)?' checked':''}>${x}</label>`).join('')}</details>`).join('')}</div><label>Otras disciplinas (opcional, separadas por comas)<input name="disciplines_other" value="${esc((m.disciplines||[]).filter(x=>!DISC_ALL.includes(x)).join(', '))}"></label><label>Ciudad<input name="location" value="${esc(m.location)}"></label>${m.role==='artist'?`<label>Teléfono de contacto (opcional)<input name="phone" type="tel" inputmode="tel" maxlength="25" value="${esc(m.phone||'')}" placeholder="+34 600 000 000"></label><p class="meta" style="margin-top:-6px">Aviso: si lo escribes, solo lo verán los clientes que han desbloqueado el contacto (publican un bolo) y los clientes a los que envíes una propuesta. Nunca aparece en el listado ni en la portada. Es voluntario y puedes borrarlo cuando quieras.</p>`:''}<label>Enlace a tu portfolio (https://…)<input name="portfolio_url" value="${esc(m.portfolio_url)}"></label>
  <h3 style="margin:8px 0 0">Redes</h3>${SOCIALS.map(([k,n])=>`<label>${n}${k==='website'?' (https://…)':' (enlace completo, https://…)'}<input name="${k}" type="url" value="${esc(m[k])}" placeholder="https://"></label>`).join('')}
  <div id="e"></div><button class="btn" type="submit">Guardar</button></form>
  <div class="sect"><h2>Fotos (${md.nPhotos}/8)</h2>${md.photos||'<p class="meta">Aún no has subido fotos.</p>'}<label>Añadir foto<input type="file" id="ph" accept="image/*"></label><div id="pe"></div></div>
  <div class="sect"><h2>Vídeos (${md.nVideos}/5)</h2>${md.videos||'<p class="meta">Aún no has añadido vídeos.</p>'}<form id="vf"><label>Enlace de YouTube, Vimeo, Instagram, Facebook o TikTok<input name="url" type="url" required placeholder="https://"></label><button class="btn" type="submit">Añadir vídeo</button><div id="ve"></div></form></div>
  <div class="row"><button class="btn sec" id="out">Salir</button></div>`;
  $('#f').onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));const body={name:f.name,bio:f.bio,disciplines:[...new Set([...[...e.target.querySelectorAll('input[name=d]:checked')].map(x=>x.value),...list(f.disciplines_other||'')])],location:f.location,portfolio_url:f.portfolio_url};SOCIALS.forEach(([k])=>body[k]=(f[k]||'').trim());
    if(m.role==='artist'){body.showcase=!!f.showcase;body.listed=!!f.listed;body.phone=(f.phone||'').trim();}
    if(body.disciplines.length>12){$('#e').innerHTML=msg('err','Máximo 12 disciplinas. Quita alguna.');return;}
    if(body.disciplines.some(x=>x.length>60)){$('#e').innerHTML=msg('err','Cada disciplina puede tener como máximo 60 letras.');return;}
    try{me=await call('/api/me',{method:'PATCH',auth:true,body});$('#e').innerHTML=msg('ok','Guardado.');}catch(err){$('#e').innerHTML=msg('err',err.message);}};
  const busy=(id,t)=>{$(id).innerHTML=msg('info',t);};
  $('#av').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('#ae','Subiendo foto…');try{const image=await shrink(f);await call('/api/me/avatar',{method:'POST',auth:true,body:{image}});me=null;profile(v);}catch(err){$('#ae').innerHTML=msg('err',err.message);}};
  $('#ph').onchange=async e=>{const f=e.target.files[0];if(!f)return;busy('#pe','Subiendo foto…');try{const image=await shrink(f);await call('/api/media/photo',{method:'POST',auth:true,body:{image}});profile(v);}catch(err){$('#pe').innerHTML=msg('err',err.message);}};
  $('#vf').onsubmit=async e=>{e.preventDefault();const url=new FormData(e.target).get('url');try{await call('/api/media/video',{method:'POST',auth:true,body:{url}});profile(v);}catch(err){$('#ve').innerHTML=msg('err',err.message);}};
  v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Borrar?'))return;try{await call('/api/media/'+encodeURIComponent(b.dataset.del),{method:'DELETE',auth:true});profile(v);}catch(err){alert(err.message);}});
  v.querySelectorAll('[data-go]').forEach(a=>a.onclick=e=>{e.preventDefault();setTab(a.dataset.go);});
  $('#out').onclick=async()=>{try{await call('/api/auth/logout',{method:'POST',auth:true,body:{refresh_token:session.refresh_token}});}catch{}session=null;keep();me=null;setTab('inicio');};});}
call('/health').catch(()=>{});

let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;setupInstall();});
window.addEventListener('appinstalled',()=>{deferredInstall=null;const b=document.getElementById('appbox');if(b)b.hidden=true;});
if(window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true)document.documentElement.classList.add('sa');
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;}
function setupInstall(){
  const box=document.getElementById('appbox');if(!box||isStandalone())return;
  box.hidden=false;
  const btn=document.getElementById('inst'),how=document.getElementById('how');
  const ua=navigator.userAgent,ios=/iphone|ipad|ipod/i.test(ua),android=/android/i.test(ua);
  btn.onclick=async()=>{
    if(deferredInstall){try{deferredInstall.prompt();await deferredInstall.userChoice;}catch{}deferredInstall=null;return;}
    how.hidden=false;
    how.style.cssText='background:#f5f1ea;border-radius:6px;padding:12px 14px;color:#141414';
    const mac=/macintosh/i.test(ua)&&!ios&&!/chrome|chromium|edg/i.test(ua);
    how.innerHTML=ios?'<b>En iPhone o iPad:</b><p style="margin:4px 0">Tiene que ser en <b>Safari</b> (la brújula azul). No funciona desde dentro de WhatsApp, Instagram u otras apps: copia el enlace y pégalo en Safari.</p><ol><li>Abajo del todo, pulsa el botón Compartir (el cuadrado con la flecha hacia arriba).</li><li>Desliza el menú hacia arriba hasta ver "Añadir a pantalla de inicio" (si no sale, pulsa "Más").</li><li>Pulsa "Añadir". Ya tienes el icono del corazón en tu móvil.</li></ol>'
    :mac?'<b>En Mac (Safari):</b><ol><li>En el menú de arriba, pulsa Archivo.</li><li>Elige "Añadir al Dock".</li><li>Pulsa "Añadir". Ya tienes TengoBolo como app en el Dock.</li></ol>'
    :(/chrome|edg/i.test(ua)&&!android)?'<b>En Chrome o Edge del ordenador:</b><ol><li>Mira a la derecha de la barra de direcciones: aparece un icono de instalar (una pantalla con una flecha).</li><li>Si no lo ves, abre el menú de tres puntos, ve a "Enviar, guardar y compartir" (o "Guardar y compartir") y elige "Instalar TengoBolo".</li><li>Si ya la instalaste antes, ábrela desde Aplicaciones o el Launchpad: Chrome no vuelve a ofrecerla.</li></ol>'
    :android?'<b>En Android (Chrome):</b><ol><li>Pulsa los tres puntos arriba a la derecha.</li><li>Elige "Instalar aplicación" o "Añadir a pantalla de inicio".</li><li>Confirma. Ya tienes el icono del corazón en tu móvil.</li></ol>'
    :'<b>Así se instala en tu dispositivo:</b><ul><li><b>iPhone o iPad:</b> abre esta web en Safari, pulsa Compartir y "Añadir a pantalla de inicio".</li><li><b>Mac con Safari:</b> menú Archivo y "Añadir al Dock".</li><li><b>Android:</b> en Chrome, menú de tres puntos e "Instalar aplicación".</li><li><b>Ordenador con Chrome o Edge:</b> icono de instalar a la derecha de la barra de direcciones.</li></ul>';
    how.scrollIntoView({behavior:'smooth',block:'nearest'});
  };
}
if('serviceWorker' in navigator){let had=!!navigator.serviceWorker.controller,rl=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!rl){rl=true;location.reload();}had=true;});window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{r.update().catch(()=>{});document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{});});}).catch(()=>{}));}
restore().then(()=>{try{const p=new URLSearchParams(location.search);if(p.get('alta')==='artista'&&!session){rolePre='artist';tab='entrar';}else if(p.get('alta')==='agencia'&&!session){rolePre='agency';tab='entrar';}}catch(e){}render();});
